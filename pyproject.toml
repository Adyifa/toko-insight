[project]
name = "toko-insight"
version = "0.1.0"
description = "AI analytics agent for minimarket sales: tool calling, text-to-SQL and backtested forecasts"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-ra"
